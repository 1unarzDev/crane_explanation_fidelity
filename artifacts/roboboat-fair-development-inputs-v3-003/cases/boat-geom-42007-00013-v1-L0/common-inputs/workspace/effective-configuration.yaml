behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: odom
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    robot_base_frame: base_link
    rotational_acc_lim: 0.5
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.2
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    action_server_result_timeout: 60.0
    bt_loop_duration: 10
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: odom
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: /crane/odom
    robot_base_frame: base_link
    use_sim_time: true
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 2.0
      desired_linear_vel: 0.15
      lookahead_dist: 0.8
      lookahead_time: 1.5
      max_lookahead_dist: 0.6
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.02
      min_lookahead_dist: 0.2
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_collision_detection: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.5
    failure_tolerance: 0.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      rot_stopped_velocity: 0.05
      trans_stopped_velocity: 0.05
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /crane/odom
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: false
      global_frame: odom
      height: 60
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.2
      robot_base_frame: base_link
      robot_radius: 0.8
      rolling_window: true
      track_unknown_space: false
      update_frequency: 5.0
      use_sim_time: true
      voxel_layer:
        enabled: true
        mark_threshold: 0
        max_obstacle_height: 3.0
        observation_sources: pointcloud
        origin_z: -2.0
        plugin: nav2_costmap_2d::VoxelLayer
        pointcloud:
          clearing: true
          data_type: PointCloud2
          expected_update_rate: 0.0
          marking: true
          max_obstacle_height: 3.0
          min_obstacle_height: -1.5
          observation_persistence: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 1.0
          raytrace_max_range: 25.0
          raytrace_min_range: 1.0
          topic: /points
        publish_voxel_map: false
        z_resolution: 0.25
        z_voxels: 16
      width: 60
lifecycle_manager_controller:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names:
    - controller_server
    - planner_server
    - behavior_server
    - bt_navigator
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: false
      global_frame: odom
      height: 20
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      robot_radius: 0.8
      rolling_window: true
      update_frequency: 10.0
      use_sim_time: true
      voxel_layer:
        enabled: true
        mark_threshold: 0
        max_obstacle_height: 3.0
        observation_sources: pointcloud
        origin_z: -2.0
        plugin: nav2_costmap_2d::VoxelLayer
        pointcloud:
          clearing: true
          data_type: PointCloud2
          expected_update_rate: 0.0
          marking: true
          max_obstacle_height: 3.0
          min_obstacle_height: -1.5
          observation_persistence: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 1.0
          raytrace_max_range: 25.0
          raytrace_min_range: 1.0
          topic: /points
        publish_voxel_map: false
        z_resolution: 0.25
        z_voxels: 16
      width: 20
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
    costmap_update_timeout: 1.0
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: true
